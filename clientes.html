<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Clientes Cadastrados</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Clientes Cadastrados</h1>

    <table border="1" cellpadding="10">

        <tr>
            <th>CPF</th>
            <th>Primeiro Nome</th>
            <th>Sobrenome</th>
            <th>Idade</th>
            <th>Ações</th>
        </tr>

        <!-- JINJA2 -->
        {% for cliente in clientes %}

        <tr>

            <td>{{ cliente[0] }}</td>
            <td>{{ cliente[1] }}</td>
            <td>{{ cliente[2] }}</td>
            <td>{{ cliente[3] }}</td>

            <td>

                <a href="{{ url_for('deletar_cliente', cpf=cliente[0]) }}">

                    <button>
                        Excluir
                    </button>

                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">
        Voltar
    </a>

</body>

</html>
